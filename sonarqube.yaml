steps:
  # Шаг 1: Создание правила Firewall для порта 9000 (если его еще нет)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-firewall'
      entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute firewall-rules describe allow-sonarqube-9000 --project=$PROJECT_ID &>/dev/null; then
          echo "Creating firewall rule for port 9000..."
          gcloud compute firewall-rules create allow-sonarqube-9000 \
            --project=$PROJECT_ID \
            --allow=tcp:9000 \
            --source-ranges=0.0.0.0/0 \
            --target-tags=sonarqube-server \
            --description="Allow SonarQube UI and API"
        else
          echo "Firewall rule already exists."
        fi

  # Шаг 2: Создание или обновление ВМ с Docker и SonarQube
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sonarqube'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ZONE="europe-west8-b"
        INSTANCE_NAME="sonarqube-server"

        # Скрипт инициализации: настраивает ядро ОС, ставит Docker и запускает контейнер
        cat << 'EOF' > startup.sh
        #!/bin/bash
        set -e
        if swapon --show | grep -q "/swapfile"; then
          echo "Swapfile is already active."
          exit 0
        fi

        echo "1. Creating 4 GB swapfile..."
        dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress

        echo "2. Securing permissions and SELinux context..."
        chmod 600 /swapfile
        chcon -t swapfile_t /swapfile || true

        echo "3. Formatting and activating swap..."
        mkswap /swapfile
        swapon /swapfile

        echo "4. Persisting to /etc/fstab..."
        if ! grep -q "/swapfile" /etc/fstab; then
          cp /etc/fstab /etc/fstab.bak
          echo "/swapfile none swap sw 0 0" >> /etc/fstab
        fi

        echo "5. Tuning swappiness..."
        cat << "EOF" > /etc/sysctl.d/99-swap.conf
        vm.swappiness=10
        vm.vfs_cache_pressure=50
        EOF
        sysctl -p /etc/sysctl.d/99-swap.conf

        echo "=== Swap successfully enabled ==="
        swapon --show
        
        # 1. Обязательные параметры ядра для Elasticsearch в SonarQube
        sysctl -w vm.max_map_count=524288
        sysctl -w fs.file-max=131072
        echo "vm.max_map_count=524288" >> /etc/sysctl.conf
        echo "fs.file-max=131072" >> /etc/sysctl.conf

        # 2. Установка Docker
        apt-get update -y
        apt-get install -y docker.io
        systemctl enable --now docker

        # 3. Запуск актуального контейнера SonarQube с постоянными томами (volumes)
        docker pull sonarqube:community
        docker stop sonarqube 2>/dev/null || true
        docker rm sonarqube 2>/dev/null || true

        docker run -d \
          --name sonarqube \
          --restart unless-stopped \
          -p 9000:9000 \
          -v sonarqube_data:/opt/sonarqube/data \
          -v sonarqube_extensions:/opt/sonarqube/extensions \
          -v sonarqube_logs:/opt/sonarqube/logs \
          sonarqube:community
        EOF

        if gcloud compute instances describe $$INSTANCE_NAME --zone=$$ZONE --project=$PROJECT_ID &>/dev/null; then
          echo "Instance exists. Updating startup script and restarting..."
          gcloud compute instances add-metadata $$INSTANCE_NAME \
            --zone=$$ZONE \
            --project=$PROJECT_ID \
            --metadata-from-file=startup-script=startup.sh
          gcloud compute instances reset $$INSTANCE_NAME --zone=$$ZONE --project=$PROJECT_ID
        else
          echo "Creating new Ubuntu VM with Docker and SonarQube..."
          gcloud compute instances create $$INSTANCE_NAME \
            --zone=$$ZONE \
            --project=$PROJECT_ID \
            --machine-type=e2-small \
            --image-family=ubuntu-2204-lts \
            --image-project=ubuntu-os-cloud \
            --boot-disk-size=30GB \
            --boot-disk-type=pd-balanced \
            --tags=sonarqube-server \
            --metadata-from-file=startup-script=startup.sh
        fi

  # Шаг 3: Получение и вывод внешнего IP-адреса
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-ip'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IP=$(gcloud compute instances describe sonarqube-server \
          --zone=europe-west8-b \
          --project=$PROJECT_ID \
          --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
        echo "=================================================="
        echo "SonarQube URL: http://$${IP}:9000"
        echo "Default credentials: admin / admin"
        echo "(Пожалуйста, подождите 2-3 минуты после завершения сборки, пока Docker загрузит и запустит SonarQube)"
        echo "=================================================="

options:
  logging: CLOUD_LOGGING_ONLY
